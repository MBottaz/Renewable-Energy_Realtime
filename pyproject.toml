[project]
name = "renewable-energy-realtime"
version = "0.2.0"
description = "Static website for visualizing and simulating hourly energy mix scenarios for European countries, powered by ENTSO-E data."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "entsoe-py>=0.7.11",
    "pandas>=3.0.1",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
]