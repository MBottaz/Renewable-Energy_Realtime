[project]
name = "renewable-energy-realtime"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "dotenv>=0.9.9",
    "entsoe-py>=0.7.11",
    "matplotlib>=3.10.8",
    "pandas>=3.0.1",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["setuptools>=75.8", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
energy-match = "energy_match.cli:main"
