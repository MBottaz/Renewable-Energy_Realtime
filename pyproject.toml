[project]
name = "renewable-energy-realtime"
version = "0.1.0"
description = "Dispatch simulation for renewable energy matching"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "entsoe-py>=0.7.11",
    "matplotlib>=3.10.8",
    "pandas>=3.0.1",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["setuptools>=75.8", "wheel"]
build-backend = "setuptools.build_meta"

