<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Renewable Energy Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>Renewable Energy Dashboard</h1>
    <p>ENTSO-E Transparency Platform — Production &amp; Installed Capacity</p>
  </header>

  <main>
    <section id="controls" class="card">
      <label>
        Country
        <select id="country-select"></select>
      </label>
      <label>
        Start Date
        <input type="date" id="date-start">
      </label>
      <label>
        End Date
        <input type="date" id="date-end">
      </label>
      <p class="controls-help">Charts update automatically. Dates are interpreted in UTC.</p>
    </section>
    <div id="status"></div>

    <section id="chart-area">
      <div class="card chart-card">
        <h2>Hourly renewable production</h2>
        <div id="chart-caption" class="chart-caption"></div>
        <div class="chart-container production-chart-container">
          <canvas id="chart"></canvas>
        </div>
      </div>

      <div class="card chart-card">
        <h2>Installed capacity</h2>
        <div id="capacity-caption" class="chart-caption"></div>
        <div class="chart-container capacity-chart-container">
          <canvas id="capacity-chart"></canvas>
        </div>
        <div id="capacity-grid"></div>
      </div>
    </section>
  </main>

  <footer>
    Source: ENTSO-E Transparency Platform &bull; Renewable Energy Realtime
  </footer>

  <!-- Vendored, so the page needs no network: works by opening index.html -->
  <script src="js/chart.umd.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
